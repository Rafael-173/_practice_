<div class="grid three">
    {% for group in groups %}
        <article class="card">
            <span class="pill">{{ group.category.code }}</span>
            <h2>{{ group.name }}</h2>
            <p>{{ group.branch.name }}</p>
            <p>{{ group.start_date|date:"d.m.Y" }} — {{ group.end_date|date:"d.m.Y" }}</p>
            <strong class="price">{{ group.price }} ₽</strong>
            <a class="btn btn-outline" href="{% url 'group_detail' group.pk %}">Подробнее</a>
        </article>
    {% empty %}
        <p>По выбранным параметрам групп нет.</p>
    {% endfor %}
</div>
